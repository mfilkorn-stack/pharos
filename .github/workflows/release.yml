name: Release

# Nur manuell, wie in VermieterOS: Pushes und Pull Requests lösen nichts aus.
# Vor einem Deployment: Actions → „Release“ → „Run workflow“ auf main. Die Action prüft
# Tests und Build; sie hat keinen Zugang zum Server. Ausgerollt wird erst danach von Hand:
#   ssh -t pharos 'cd /opt/pharos && bash deploy/deploy.sh'
# (siehe DEPLOY-HETZNER.md, Abschnitt 7)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Gleiche Major-Version wie auf dem Server (DEPLOY-HETZNER.md, NodeSource 20.x).
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
